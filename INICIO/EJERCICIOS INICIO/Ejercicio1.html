// ENUNCIADO 1 
// Pide una edad y si el valor es mayor de 18 años muestra 
un mensaje indicando que ya puede conducir. 
Trata de validar si se introduce un número.

<!DOCTYPE html>
<html lang="es">
<head>
    <title>título</title>
	<meta charset="utf-8" />

    <script>
        // Pedir un número por teclado
        let edad = number(prompt("Introduce un número"));
            if (edad >= 18) {
                alert("Es mayor de edad");
            }
            else {
                alert("Es menor de edad");
            }
    </script>
    </head>
<body>
	
</body>
</html>
