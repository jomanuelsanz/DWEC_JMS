<!--
(String) 

Crea un script que reciba una cadena de texto. 
El script ahora elimina todos los espacios a los lados 
y comprueba si la cadena contiene la palabra “JavaScript” ya sea en mayúsculas o minúsculas.
    - Si no la contiene, devuelve un mensaje indicando que no la encontró.
    - Si encuentra la cadena, el usuario deberá adivinar en qué posición empieza
    esta cadena. Cada vez que el usuario falle, el script le dará pistas e indicará
    si la posición es mayor o menor hasta que acierte. Cuando acierte, el script
    mostrará el número de intentos realizados y el resto de la cadena después de la palabra “JavaScript”.
-->

<!DOCTYPE HTML>
<html>

<body>

    <script>
        let cadena = prompt("Introduce un texto");
        alert(cadena.trim())
        alert(cadena.includes("JavaScript"))
            

    </script>

</body>

</html>
