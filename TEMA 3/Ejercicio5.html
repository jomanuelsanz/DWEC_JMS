<!-- 
(Acceso y modificación documento HTML) 

Crea una página en HTML con el  siguiente contenido:

<h2>Nombre del alumno</h2>
<p id="notaFinal">Resultado de la evaluación:</p>
<div class="mensaje"></div>

El HTML pide al usuario con prompt su nombre y apellidos y una calificación de 0 a 10
(se validará que el número introducido es correcto). El script sobrescribe la página y
añade la siguiente información:
    - En etiqueta h2 se añade el nombre del alumno.
    - En el párrafo con identificador “notaFinal” se añade una etiqueta strong con el
texto “Nota: ${calificación}”, siendo la calificación el número introducido por teclado.
    - En el div con la clase mensaje se muestra un texto indicando si la nota es
SUSPENSO (menor que 5), APROBADO (entre 5 y 6), BIEN (de 6 a 7),
NOTABLE (de 7 a 9) y SOBRESALIENTE (de 9 en adelante).

El script debe emplear al menos una vez los métodos y propiedades getElementById,
querySelector, getElementsByTagName, innerHTML y textContent.

IMPORTANTE: Añade el script al final del HTML del body. Más adelante se estudiará el motivo
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Nombre del alumno: </h2>
    <p id="notaFinal">Resultado de la evaluación: </strong></p>
    <div class="mensaje"></div>
    <script>

        // Pedimos al usuario nombre y apellidos
        let datos= prompt("Introduce tu nombre y apellidos:");

        // Comprobamos la nota
        let calificacion=Number(prompt("Introduce una calificación de 0 a 10: "));


        let resultado="";  // Esto significa que en la variable resultado se va a guardar un texto

        if (calificacion<5){
            resultado= "suspenso";
        }
        else if (calificacion<6){
            resultado="aprobado";
        }
        else if (calificacion <7){
            resultado="bien";
        }
        else if(calificacion <9){
            resultado="notable";
        }
        else {
            resultado= "sobresaliente";
        }

        
        //cambiar h2
        document.getElementsByTagName("h2")[0].textContent = "Nombre del alumno: " + datos;

        //añadir la nota al parrafo. Poner comillas simples invertidas
        document.getElementById("notaFinal").innerHTML = `Resultado de la evaluación: <strong>${calificacion}</strong>`;
        //resultado
        document.querySelector(".mensaje").textContent = `Calificación: ${resultado}`;

      
    </script>
</body>
</html>
