<!--
(Manipulación dinámica de CSS)

Crea una página en HTML con el siguiente contenido:

<h1 id="titulo">Bienvenido/a</h1>
<p class="descripcion">Este es un texto de prueba.</p>
<div class="contenedor">
    <p class="resaltado">Este párrafo está dentro de un contenedor.</p>
</div>

Se añade el siguiente CSS:
<style>
    .resaltado {
        background-color: yellow;
        font-weight: bold;
        padding: 4px;
    }
</style>

Solicita al usuario la siguiente información:
    - Un prompt con un nuevo color para el texto del h1 (por ejemplo: "blue", "#ff0000"...). 
    No hace falta validar el formato del color
    - Un confirm indicando si quiere resaltar el texto del párrafo con clase “descripcion”.
    Si acepta, se añadirá al párrafo la clase llamada “resaltado” y se eliminará del párrafo que inicialmente tiene esta clase y se sitúa dentro del div. 
        - Si el usuario ha aceptado y la clase “resaltado” se cambia de párrafo, se mostrará otro confirm indicando si quiere ocultar el contenedor. 
        Si acepta, se oculta la propiedad display del div con clase “contenedor”

HTML:5 y se completa
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .resaltado {
            background-color: yellow;
            font-weight: bold;
            padding: 4px;
        }
    </style>
</head>

<body>
    <h1 id="titulo">Bienvenido/a</h1>
    <p class="descripcion">Este es un texto de prueba.</p>
    <div class="contenedor">
        <p class="resaltado">Este párrafo está dentro de un contenedor.</p>
    </div>


    <script>
        
        // getElementById se usa para seleccionar las clases con id. (Abajo... Por ejemplo "título")
        // querySelector se usa para seleccionar las clases que no están definidas con un id (Abajo... Por ejemplo ".descripcion" y ".resaltado")


        // Pedimos el color con el promt. 
        // Después con el getElementById llamamos a título y le asignamos el nuevo style.color = color
        let color = prompt("Introduce un nuevo color para el título:");
        document.getElementById("titulo").style.color = color;   // Aqu

        // Preguntamos si quiere resaltar el párrafo con clase descripción
        let respuesta = confirm("¿Quieres resaltar el texto del párrafo?");
        if (respuesta) {

            // Seleccionamos los dos párrafos
            let parrafoDescripcion = document.querySelector(".descripcion");
            let parrafoResaltado = document.querySelector(".resaltado");

            // Añadimos la clase resaltado al párrafo descripcion
            parrafoDescripcion.classList.add("resaltado");

            // Eliminar la clase resaltado del párrafo original
            parrafoResaltado.classList.remove("resaltado");

            // Preguntamos si quiere ocultar el contenedor
            let ocultar = confirm("¿Quieres ocultar el contenedor?");

            if (ocultar) {
                // Ocultamos el contenedor
                document.querySelector(".contenedor").style.display = "none";
            }

        }

    </script>
</body>

</html>
